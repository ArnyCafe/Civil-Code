<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法典註記本</title>
<meta name="description" content="職業安全衛生法及相關勞動法規、民法、刑法電子法典：條號依章別反白上色、條旨、重要判決與函釋、立法理由、新舊條文對照；可用 Apple Pencil 手寫、紅色小字註記、便利貼，並可跨法搜尋。">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="法典註記本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-START-->
<div id="app" class="app">
  <header class="topbar">
    <button class="icon-btn" id="btn-nav" aria-label="目錄" title="目錄">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="brand" id="btn-law" title="切換法典（法典書架）" aria-label="切換法典">
      <span class="brand-mark" id="brand-mark">職</span>
      <span class="brand-name" id="brand-name">法典註記本</span>
      <svg class="brand-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
    <form class="searchbox" id="search-form" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" id="q" placeholder="搜尋條文、判決、註記；輸入 6、勞基法59 直接跳轉" enterkeyhint="search">
    </form>
    <button class="icon-btn" id="btn-eye" aria-pressed="true" title="隱藏我的註記" aria-label="顯示或隱藏我的註記">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-on"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="eye-off"><path d="M4 4l16 16"/><path d="M9.9 5.8A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.6 7.4A16 16 0 0 0 2.5 12S6 18.5 12 18.5a9.2 9.2 0 0 0 3.6-.7"/></svg>
    </button>
    <button class="icon-btn" id="btn-ink" aria-pressed="false" title="手寫模式（Apple Pencil）" aria-label="手寫模式">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.4L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M13.5 7.3l3.2 3.2"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" aria-label="設定" title="設定與備份">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></svg>
    </button>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="導覽">
    <nav class="seg" role="tablist">
      <button role="tab" data-side="toc" aria-selected="true">目錄</button>
      <button role="tab" data-side="search" aria-selected="false">搜尋</button>
      <button role="tab" data-side="mine" aria-selected="false">我的註記</button>
    </nav>
    <div class="side-body" id="side-toc"></div>
    <div class="side-body" id="side-search" hidden></div>
    <div class="side-body" id="side-mine" hidden></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="reader" id="reader" tabindex="-1">
    <div class="reader-inner" id="reader-inner">
      <div class="loading" id="loading">載入條文中…</div>
    </div>
  </main>

  <section class="detail" id="detail" aria-label="條文詳細" hidden>
    <header class="detail-head">
      <button class="icon-btn" id="d-close" aria-label="關閉">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="d-title"><span id="d-no"></span><small id="d-path"></small></div>
      <button class="icon-btn" id="d-prev" aria-label="上一條"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn" id="d-next" aria-label="下一條"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icon-btn star-btn" id="d-star" aria-pressed="false" aria-label="加入書籤">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"/></svg>
      </button>
    </header>
    <div class="d-text" id="d-text"></div>
    <nav class="tabs" id="d-tabs" role="tablist"></nav>
    <div class="d-body" id="d-body"></div>
  </section>
</div>

<div class="inkbar" id="inkbar" hidden>
  <div class="ink-tools" role="toolbar" aria-label="手寫工具">
    <span class="ink-grp">
      <button data-color="red" class="sw sw-red" aria-pressed="true" title="紅筆" aria-label="紅筆"></button>
      <button data-color="blue" class="sw sw-blue" aria-pressed="false" title="藍筆" aria-label="藍筆"></button>
      <button data-color="black" class="sw sw-black" aria-pressed="false" title="黑筆" aria-label="黑筆"></button>
      <button data-color="green" class="sw sw-green" aria-pressed="false" title="綠筆" aria-label="綠筆"></button>
      <button data-color="mark" class="sw sw-mark" aria-pressed="false" title="黃色螢光筆" aria-label="黃色螢光筆"></button>
      <button data-color="markp" class="sw sw-markp" aria-pressed="false" title="粉色螢光筆" aria-label="粉色螢光筆"></button>
    </span>
    <span class="ink-sep"></span>
    <span class="ink-grp ink-wgrp">
      <span class="ink-dotbox" aria-hidden="true"><span class="ink-dot" id="ink-dot"></span></span>
      <input type="range" id="ink-w" min="0.05" max="3" step="0.05" value="0.3" aria-label="筆寬（公釐）">
      <span class="ink-wv"><output id="ink-wv">0.3</output> mm</span>
    </span>
    <span class="ink-grp ink-pre" id="ink-pre" aria-label="常用筆寬"></span>
    <span class="ink-sep"></span>
    <span class="ink-grp">
      <button data-tool="eraser" class="tool-txt" aria-pressed="false" title="橡皮擦">擦</button>
      <button data-tool="sticky" class="tool-txt" aria-pressed="false" title="點條文放便利貼">貼</button>
      <button data-act="pressure" class="tool-txt" aria-pressed="true" title="筆壓感應">筆壓</button>
      <button data-act="undo" class="tool-txt" title="復原">復原</button>
      <button data-act="finger" class="tool-txt" aria-pressed="false" title="允許手指書寫">手指</button>
      <button data-act="done" class="tool-txt primary">完成</button>
    </span>
  </div>
  <p class="ink-hint">Apple Pencil 直接在條文上書寫，筆寬最細 0.05 mm；手指仍可捲動。「貼」：點條文放便利貼。</p>
</div>

<div class="popover" id="hl-pop" hidden role="dialog" aria-label="劃線與註記">
  <div class="pop-note" id="pop-note" hidden></div>
  <div class="pop-row">
    <button data-hl="y" class="hl-sw hl-y" title="黃色螢光" aria-label="黃色螢光"></button>
    <button data-hl="g" class="hl-sw hl-g" title="綠色螢光" aria-label="綠色螢光"></button>
    <button data-hl="b" class="hl-sw hl-b" title="藍色螢光" aria-label="藍色螢光"></button>
    <button data-hl="p" class="hl-sw hl-p" title="粉色螢光" aria-label="粉色螢光"></button>
    <button data-hl="u" class="hl-sw hl-u" title="紅色底線">U</button>
    <button data-hl="n" class="hl-sw hl-n" title="不劃線（只標記位置）">無</button>
  </div>
  <div class="pop-row">
    <button data-hl="gla" class="pop-txt red">上方註記</button>
    <button data-hl="glb" class="pop-txt red">下方註記</button>
    <button data-hl="sticky" class="pop-txt">便利貼</button>
    <button data-hl="note" class="pop-txt red" hidden>加註</button>
    <button data-hl="flip" class="pop-txt" hidden>移到下方</button>
    <button data-hl="del" class="pop-txt danger" hidden>刪除</button>
  </div>
</div>

<div class="popover ref-pop" id="ref-pop" hidden role="dialog" aria-label="引用條文">
  <div id="ref-body"></div>
  <div class="pop-row"><button class="pop-txt" data-act="ref-go">前往該條</button><button class="pop-txt" data-act="ref-close">關閉</button></div>
</div>

<dialog class="modal" id="modal">
  <form method="dialog" class="modal-card" id="modal-form">
    <header class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" value="cancel" aria-label="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--APP-END-->
<script type="module" src="js/app.js"></script>
</body>
</html>
